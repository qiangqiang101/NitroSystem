name: Release build

# Builds when a release is published on GitHub. It can also be started by hand from the Actions tab
# (Run workflow) to test the build: that run attaches the zip to the run page instead of to a release.
# Nothing builds on ordinary pushes or pull requests.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for the zip name (manual runs only)"
        required: false
        default: "manual-test"

permissions:
  contents: write   # to attach the zip to a release

jobs:
  # The platform needs llvm-mingw, so it is cross-compiled on Linux (the same way its own workflow does)
  # and produces DWrite.dll, the name Azimuth 1.0.1 and later load. d3dcompiler_47.dll is not shipped.
  platform:
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_VERSION: "20260922"
    steps:
      - name: Check out (with the platform submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install llvm-mingw + ninja
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" -o llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1

      - name: Build the platform
        env:
          CMAKE_GENERATOR: Ninja
        run: ./platform/scripts/build.sh

      - name: Keep DWrite.dll for the release build
        uses: actions/upload-artifact@v4
        with:
          name: platform-dwrite
          path: platform/dist/DWrite.dll
          if-no-files-found: error

  build:
    needs: platform
    runs-on: windows-latest
    env:
      # the release's tag, or the label typed into a manual run
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'manual-test' }}
    steps:
      - name: Check out (with the platform submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Get the platform's DWrite.dll
        uses: actions/download-artifact@v5
        with:
          name: platform-dwrite
          path: platform-dist

      - name: Configure
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG -PlatformDll platform-dist/DWrite.dll

      - name: Attach the zip to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $safe = $env:RELEASE_TAG -replace '[^A-Za-z0-9._-]', '-'
          gh release upload "$env:RELEASE_TAG" "release/FnFNitro-$safe.zip" --clobber

      - name: Keep the zip as a workflow artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: FnFNitro-manual-build-${{ github.run_number }}
          path: release/FnFNitro-*.zip
          if-no-files-found: error
          retention-days: 14
